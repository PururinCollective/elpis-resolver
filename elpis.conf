# elpis.conf -- Elpis recursive resolver
#
# Searched for, in order, when -c is not given:
#   1. elpis.conf next to the binary   (bin/elpis.conf -- normally this one)
#   2. one directory up, when the binary is in a bin/ directory
#   3. /etc/elpis/elpis.conf
#   4. /etc/elpis.conf
#
# `make` seeds bin/elpis.conf from this file the first time and never touches
# it again, so this copy stays the reference and that one is yours to edit.
# The first that exists wins.  Every setting below is shown at its default,
# so a file that is entirely comments behaves exactly like no file at all.
#
# Syntax: one "key: value" per line.  '#' starts a comment.  Repeating a key
# builds a list (listen, access-control, forward-zone, ...).

# ---------------------------------------------------------------------------
# Listening
# ---------------------------------------------------------------------------
# One line per address.  The first listen line in this file replaces the
# built-in loopback defaults rather than adding to them.
#
# The intended deployment is behind AdGuard Home or Pi-hole: they face the
# network on port 53 and forward here.  Only widen this if Elpis itself is
# meant to be reachable, and pair it with access-control below.
# Not 5353: that is mDNS, and avahi-daemon holds 0.0.0.0:5353 on most Linux
# hosts.  Both sides set SO_REUSEADDR, so the two bind without an error and
# the kernel quietly splits traffic between them.  5335 is what the Pi-hole
# and unbound guides use to avoid exactly that.
listen: 127.0.0.1@5335
listen: [::1]@5335

# To serve every interface, the two wildcards are all you need -- there is no
# reason to also list the specific addresses, and elpis warns when you do:
#
# listen: 0.0.0.0@53
# listen: [::]@53
#
# Both lines are needed.  Every IPv6 listener sets IPV6_V6ONLY, so "[::]"
# carries IPv6 only; it will not pick up IPv4 as a dual-stack socket would.
# That is deliberate: a dual-stack socket reports IPv4 peers as v4-mapped
# addresses, which makes access-control rules quietly ambiguous.

listen-udp: yes
listen-tcp: yes

# Worker threads.  "auto" uses one per CPU; each gets its own listening
# socket via SO_REUSEPORT so the kernel spreads load across them.
threads: auto

tcp-max-connections: 512
tcp-idle-timeout: 10s

# ---------------------------------------------------------------------------
# Access control
# ---------------------------------------------------------------------------
# Longest matching prefix wins, so a specific deny beats a broad allow.
# Anything not matched is refused.  "allow_snoop" additionally permits queries
# with RD clear, which read the cache without triggering recursion; grant it
# only to monitoring you trust.

# access-control: 0.0.0.0/0 allow
# access-control: ::/0 allow
access-control: 10.0.0.0/8 allow
access-control: 100.64.0.0/10 allow
access-control: 127.0.0.0/8 allow
access-control: 169.254.0.0/16 allow
access-control: 172.16.0.0/12 allow
access-control: 192.168.0.0/16 allow
access-control: ::1/128 allow
access-control: fc00::/7 allow
access-control: fe80::/10 allow

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------
# "auto" scales with the memory the host actually has (and with the cgroup
# limit when running in a container, which is usually the number that matters):
#
#     under 512 MiB   12.5%      2 - 8 GiB     20%
#     0.5 - 2 GiB     ~17%       8 - 64 GiB    25%, capped at 16 GiB
#
# The budget is split: 50% prebuilt responses, 32% RRsets, 12% delegations,
# the rest nameserver performance data.  Give it a fixed size instead if you
# would rather decide yourself: "cache-size: 2G".
#
# "Available memory" means what this process can actually use, not what the
# machine has: in a container it is the cgroup limit or the figure lxcfs puts
# in /proc/meminfo, whichever is smaller.  Setting a size larger than that is
# allowed and warned about -- the cache is a hash table, so filling it from
# swap means a page fault on a random page per lookup, which stalls a worker
# thread where a plain cache miss would not have.  Re-resolving is the cheaper
# way to miss.
cache-size: auto

cache-min-ttl: 0
cache-max-ttl: 86400
cache-max-negative-ttl: 3600
cache-min-negative-ttl: 0

# Serve expired data while a refresh is in flight (RFC 8767).  This is what
# keeps a resolver answering through an upstream outage.
serve-stale: 86400
serve-stale-reply-ttl: 30

# Refresh popular entries before they expire, so a hot name never goes cold.
# The threshold is the percentage of the original TTL still remaining when the
# refresh starts: at 10 a 300-second record is refreshed with 30 seconds left.
prefetch: yes
prefetch-threshold: 10

# What happens when a refresh fails.
#
# An unusable reply -- a timeout, SERVFAIL, REFUSED -- says nothing about the
# name, so the cached answer stays and keeps being served while the retries
# back off: 1 second, then 2, 4, 8, up to a minute.  That matters because the
# usual reason a refresh fails is that the far side is rate limiting, and
# asking once a second is how a brief limit becomes a permanent one.
#
# An authoritative NXDOMAIN is different: it is real data, and ignoring it
# would serve a deleted name for the whole serve-stale window above.  So it is
# believed, but only after repeating this many times in a row.  Because the
# attempts are backed off, this is really a length of time -- 3 is about seven
# seconds, 4 about fifteen, 6 about a minute.  Raise it if an upstream is known
# to answer NXDOMAIN when it is really just refusing.
refresh-nxdomain-confirmations: 3

# ---------------------------------------------------------------------------
# Root and TLD warming
# ---------------------------------------------------------------------------
# Elpis pins the root and every TLD delegation it learns, so once ".com" is
# known a lookup for anything under it goes straight to a .com server and
# never touches a root server again.
prime-root: yes
warm-tlds: yes

# At startup, ask every root server address -- all thirteen names on both IPv4
# and IPv6 -- the same small question a few times, and seed the round-trip
# estimates from what comes back.  Without it the first recursions pick roots
# by a default guess; with it they go straight to the closest one.  Measured
# here: cold TLD lookups finished about 40% sooner.
#
# It is a real DNS query, not an ICMP ping, so it measures the path that will
# actually be used -- including a middlebox that drops UDP/53, or a host whose
# IPv6 is configured but does not work.  If every IPv6 root is silent while
# IPv4 answers, outbound IPv6 is turned off for the run and the reason logged.
probe-roots: yes
probe-rounds: 3
probe-interval: 1h                      # 0 = probe once at startup only
tld-refresh: 24h
root-refresh: 12h

# Pull the whole root zone by AXFR at startup, which front-loads all ~1,500
# TLD delegations in one transfer instead of learning them one referral at a
# time.  ICANN permits this from the servers below.  Off by default because
# it opens an outbound TCP session to a third party at boot.
root-zone-transfer: no
root-zone-server: 192.0.32.132          # xfr.dns.icann.org
root-zone-server: [2620:0:2830:202::132]

# A BIND-style hints file overrides the built-in root server addresses.
# root-hints: /etc/elpis/named.root

# ---------------------------------------------------------------------------
# DNSSEC
# ---------------------------------------------------------------------------
# Validation is on by default with the published IANA root anchors compiled
# in (KSK-2017 tag 20326 and KSK-2024 tag 38696).  Data that fails validation
# is answered with SERVFAIL and an extended DNS error, never handed over.
dnssec: yes

# Log bogus data but serve it anyway.  For diagnosing a validation failure,
# not for running.
dnssec-permissive: no

# Treat missing signatures inside a zone proven to be signed as an attack
# rather than as an unsigned zone.
harden-dnssec-stripped: yes

# RFC 8020: nothing exists below a name that does not exist.
harden-below-nxdomain: yes

# Add anchors from a file (IANA root.key format, or "zone IN DS ..." lines).
# trust-anchor-file: /etc/elpis/root.key

# Tolerated clock skew when checking signature validity, in seconds.  Leave
# at 0 unless the host clock is known to be unreliable.
signature-clock-skew: 0

# ML-DSA (FIPS 204) DNSSEC algorithm numbers.  draft-westerbaan-dnssec-mldsa
# gives ML-DSA-44 the number 18, which is what the public test zones sign
# with, but IANA has not made it final -- and the draft assigns nothing at all
# to the 65 and 87 parameter sets, so those two values are placeholders that
# interoperate with nothing.  The verifier is complete for all three; these
# only say which number on the wire means which parameter set.
mldsa44-algorithm: 18
mldsa65-algorithm: 25
mldsa87-algorithm: 26

# ---------------------------------------------------------------------------
# DNS64 (RFC 6147)
# ---------------------------------------------------------------------------
# For IPv6-only clients: when a name has no AAAA, look up its A records and
# present them inside the prefix below.  Synthesised answers are marked
# insecure, and nothing is synthesised for a client that is validating.
dns64: no
dns64-prefix: 64:ff9b::/96
dns64-synthesize-all: no
# Ignore AAAA records inside these ranges and synthesise instead.
# dns64-ignore-aaaa: 2001:db8:bad::/48

# ---------------------------------------------------------------------------
# Resolution behaviour
# ---------------------------------------------------------------------------
edns-buffer-size: 1232                 # RFC 9715 / DNS Flag Day 2020
outgoing-port-range: 1024-65535
outgoing-sockets: 32
query-timeout: 1200                    # per upstream attempt, milliseconds
query-total-timeout: 20000             # whole resolution, including DNSSEC
max-retries: 3
max-referrals: 32

# RFC 9156: send only as much of the name as the server being asked needs.
qname-minimisation: yes
# Trust an NXDOMAIN for a shortened name.  Some authoritative servers answer
# NXDOMAIN for empty non-terminals, which strict mode would believe.
qname-minimisation-strict: no

use-cookies: yes                       # RFC 7873
# Answer BADCOOKIE when a client echoes a server cookie that does not check
# out, instead of serving it anyway.  Off by default: a client whose address
# has changed holds a legitimately stale cookie, and a hard failure there is
# hard for anyone to diagnose.  Turn it on if Elpis faces the network directly.
require-cookie: no
use-0x20: yes                          # RFC 5452 case randomisation
tcp-upstream: yes                      # follow TC=1 over TCP

do-ipv4: yes
do-ipv6: yes
prefer-ipv6: no

# Source address for outbound queries on a multi-homed host.  Startup reports
# the source the kernel would pick on its own ("root probe: IPv6 queries will
# leave from ..."); set this only when that choice is wrong -- typically when
# the global address is on one interface and the default route is on another.
# outgoing-interface: 203.0.113.9
# outgoing-interface: 2001:db8::9

# ---------------------------------------------------------------------------
# Zone routing
# ---------------------------------------------------------------------------
# forward-zone: internal.example 10.0.0.53 10.0.0.54
# stub-zone: corp.example 10.1.0.53

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------
# Queries per second per client prefix (/24 for IPv4, /56 for IPv6), with a
# burst of twice that.  0 disables.  Set these if Elpis is directly reachable.
#
# The counters are per worker thread, so the effective limit is this number
# multiplied by the thread count -- the alternative is a shared lock on the
# busiest path in the program.  Over the limit, negative answers are sent
# truncated rather than dropped: a real client retries over TCP and still gets
# its answer, while a spoofed source cannot complete the handshake.
client-qps: 0
nxdomain-qps: 0
max-udp-reply-size: 1232

# ---------------------------------------------------------------------------
# Local behaviour
# ---------------------------------------------------------------------------
# RFC 6303: answer the reverse zones for private address space locally rather
# than leaking internal topology to the root servers and AS112.
block-private-reverse: yes

# RFC 8482: answer ANY with a single HINFO instead of the whole zone.
refuse-any: yes

answer-version-bind: yes

# ---------------------------------------------------------------------------
# Identity probe
# ---------------------------------------------------------------------------
# One TXT name this resolver answers about itself, so "what am I actually
# talking to?" has a one-line answer:
#
#   nslookup -q=txt elpis.sakurako.oomuro 127.0.0.1
#   elpis.sakurako.oomuro  text = "elpis=1.0.0" "edition=community"
#                                 "build=c662164779b7" "uptime=3601"
#                                 "workers=8" "simd=avx2" "dnssec=validating"
#
# Only clients the access-control list already admits can ask.  The default
# name sits in an undelegated TLD, so it cannot be reached through a forwarder
# chain and no scan of the public DNS will find it.
identity: yes

# Change this if you would rather the probe answered to a name only you know.
# Turning identity off entirely makes the name answer NXDOMAIN like any other
# name that does not exist, so nothing reveals that the feature is there.
# identity-name: elpis.sakurako.oomuro

# What kind of deployment this is.  Free text; "community", "commercial" and
# "homelab" are the ones worth being consistent about.  This is self-declared
# and nothing verifies it -- it is here so an operator can label a fleet and
# so support can tell at a glance what it is looking at, not as a licence
# check.
edition: community

# Who runs this resolver.  Free text, empty by default, omitted when empty.
# operator: Example ISP, AS64500

# Add the OS, kernel release and hostname to the probe.  Off by default and
# worth leaving off on anything reachable from outside: a kernel release is
# a CVE lookup key and a hostname usually describes somebody's network.
#
# No IP address is ever included, whatever this is set to.  The resolver knows
# its own public v4, v6 and AS -- the status page shows them, behind a login --
# but an unauthenticated UDP probe is the wrong place to hand them out.
identity-system: no

# ---------------------------------------------------------------------------
# Process
# ---------------------------------------------------------------------------
# Sockets are bound before privileges are dropped, so port 53 works.
# When a 'listen' line asks for a port that systemd-resolved already holds and
# elpis is running as root, stop systemd-resolved first.
#
# This is not just a convenience.  Elpis sets SO_REUSEADDR on its listeners,
# and as root Linux will let it bind a port systemd-resolved already has --
# with no error at all.  The kernel then hands each arriving query to one of
# the two daemons at random, which is far worse than refusing to start.
#
# Only systemd-resolved is ever stopped, and only when running as root.  Any
# other process holding the port is named in the log and elpis exits.
#
# Note that stopping it leaves /etc/resolv.conf pointing at a stub that is no
# longer listening, so this host cannot resolve names until you repoint it;
# elpis says so when it happens.  Make it permanent with
# 'systemctl disable --now systemd-resolved'.
stop-systemd-resolved: yes

# user: elpis
# group: elpis
# chroot: /var/empty
# pidfile: /run/elpis.pid
daemonize: no

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log-level: info                        # fatal error warn info debug trace
log-destination: stderr                # stderr file syslog none
# log-file: /var/log/elpis.log

log-queries: no
log-replies: no

# Malformed input is always counted and reported in the statistics; this
# controls whether each drop also gets a log line (rate limited per reason).
log-drops: yes

# Server identifier returned for NSID, id.server and hostname.bind.
# nsid: resolver1

# Periodic statistics, 0 to disable.  SIGUSR1 prints them on demand.
statistics-interval: 0

# ---------------------------------------------------------------------------
# Status page
# ---------------------------------------------------------------------------
# A read-only web page showing what the resolver is doing: cache hit rate,
# response times, CPU and memory, queries and SERVFAIL per second, the busiest
# names and clients, and the recent log.  It has no endpoint that changes
# anything -- it cannot alter how a single query is answered.
#
# Off by default, and not only for safety: counting every query exactly, which
# is what makes the "top names" tables trustworthy at low query rates, is work
# the resolver should not do for a page nobody is looking at.
webgui: no

# Loopback by default on purpose.  This speaks plain HTTP: there is no TLS in
# the resolver and there should not be -- a DNS resolver has no business
# carrying a TLS stack for a status page.  Reach it one of three ways:
#
#   ssh -L 8082:127.0.0.1:8082 user@resolver     then http://127.0.0.1:8082/
#   over a VPN, with webgui-listen on the VPN address
#   behind nginx or apache, which already terminates TLS with your certificate
#
# The last is what to use if you want a certificate: the proxy holds it, and
# this stays on loopback where nothing else can reach it.
webgui-listen: 127.0.0.1@8082

# Who may look.  With no password set, one is generated at startup and printed
# to stderr -- once.  Put it here to keep it, or it changes on every restart.
webgui-username: admin

# Write the password in plaintext and it is replaced, in this file, by a
# PBKDF2-SHA256 hash the first time the resolver starts.  If the file cannot be
# written the hash is still used, but the plaintext stays on disk and you are
# told so.
# webgui-password: choose-something
