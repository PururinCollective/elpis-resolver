<!DOCTYPE html>
<html lang='en' data-theme='dark'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>ELPIS Resolver</title>
<style>
:root{
  --desk:#252a31; --win:#2f343c; --title:#3a4049; --titlefg:#e8ebee;
  --fg:#d5d9de; --dim:#8d949d; --line:#454b55; --accent:#2f9ee0;
  --grid:#3a4049; --ok:#4caf50; --warn:#e0a32f; --bad:#e05252; --bar:#1b1e24;
  --titleon:#193B55;
}
:root[data-theme='light']{
  --desk:#c9ccd1; --win:#f6f7f9; --title:#e4e6ea; --titlefg:#20242a;
  --fg:#20242a; --dim:#5f666f; --line:#b6bac0; --accent:#1f7fbf;
  --grid:#d8dbe0; --ok:#2e7d32; --warn:#a96b00; --bad:#c22; --bar:#e4e6ea;
  --titleon:#C4E0F5;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--fg);
  font:12px/1.45 'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:22px;background:var(--desk)}
.brand{display:flex;align-items:center;gap:12px;letter-spacing:.22em;
  font-size:19px;font-weight:600;color:var(--fg)}
.brand svg{width:30px;height:30px}
.card{background:var(--win);border:1px solid var(--line);border-radius:8px;
  padding:26px 30px;min-width:330px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.row label{width:74px;text-align:right;color:var(--dim)}
.row input{flex:1;background:var(--desk);color:var(--fg);padding:7px 9px;
  border:1px solid var(--line);border-radius:4px;font:inherit;min-width:0}
.row input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.card button{width:100%;margin-top:6px;padding:8px;border:0;border-radius:4px;
  background:var(--accent);color:#fff;font-weight:600}
.card button:hover{filter:brightness(1.1)}
#err{color:var(--bad);min-height:16px;text-align:center;margin-top:8px}
.hint{color:var(--dim);text-align:center;max-width:430px;line-height:1.6}

/* ---------- desktop ---------- */
#desk{display:none;height:100%;flex-direction:column}
#top{height:30px;background:var(--bar);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 10px;flex:0 0 auto}
#top .brand{font-size:12px;letter-spacing:.16em}
#top .brand svg{width:16px;height:16px}
.spacer{flex:1}
.tbtn{background:transparent;border:1px solid var(--line);color:var(--fg);
  padding:3px 9px;border-radius:4px}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
#surface{position:relative;flex:1;overflow:hidden}
#icons{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;
  flex-wrap:wrap;align-content:flex-start;gap:6px}
.icon{width:86px;padding:9px 4px;text-align:center;border-radius:6px;
  cursor:pointer;user-select:none;border:1px solid transparent}
.icon:hover{background:rgba(127,127,127,.16);border-color:var(--line)}
.icon svg{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:1.6}
.icon div{margin-top:5px;font-size:11px;color:var(--fg)}

/* ---------- windows ---------- */
.win{position:absolute;background:var(--win);border:1px solid var(--line);
  border-radius:5px;box-shadow:0 10px 30px rgba(0,0,0,.34);display:flex;
  flex-direction:column;min-width:270px;min-height:130px;overflow:hidden}
.win.active{border-color:var(--accent)}
.win.active .wt{background:var(--titleon)}
.wt{height:26px;background:var(--title);color:var(--titlefg);display:flex;
  align-items:center;gap:7px;padding:0 4px 0 8px;cursor:move;user-select:none;
  flex:0 0 auto;font-size:11px;font-weight:600}
.wt svg{width:13px;height:13px;stroke:var(--accent);fill:none;stroke-width:1.8}
.wt .x{margin-left:auto;width:21px;height:19px;border:0;background:transparent;
  color:var(--titlefg);border-radius:3px;line-height:1;font-size:14px}
.wt .x:hover{background:var(--bad);color:#fff}
.wb{padding:10px;overflow:auto;flex:1}
.rz{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}
.rz::after{content:'';position:absolute;right:3px;bottom:3px;width:7px;height:7px;
  border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);opacity:.7}

/* ---------- content ---------- */
table{border-collapse:collapse;width:100%;font-size:11px}
th{text-align:left;color:var(--dim);font-weight:600;padding:3px 6px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--win)}
td{padding:2px 6px;border-bottom:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px}
.kv b{color:var(--dim);font-weight:400}
.kv span{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:26px;font-weight:300;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:9px}
.tile{border:1px solid var(--line);border-radius:5px;padding:9px}
.tile b{display:block;color:var(--dim);font-weight:400;font-size:11px;
  margin-bottom:2px}
.gwrap{margin-bottom:10px}
.ghead{display:flex;font-size:11px;color:var(--dim);margin-bottom:3px}
canvas{width:100%;display:block;border:1px solid var(--line);background:transparent}
.log{font:11px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;
  word-break:break-word}
.log div{padding:1px 4px;border-bottom:1px solid var(--line)}
.lv-FATAL,.lv-ERROR{color:var(--bad)}
.lv-WARN{color:var(--warn)}
h4{margin:0 0 5px;font-size:11px;color:var(--dim);font-weight:600;
  text-transform:uppercase;letter-spacing:.06em}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.tm{display:flex;height:100%;gap:0;margin:-10px}
.tmside{width:158px;flex:0 0 auto;overflow-y:auto;border-right:1px solid var(--line);
  padding:6px 4px}
.tmitem{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:4px;
  cursor:pointer;border:1px solid transparent}
.tmitem:hover{background:rgba(127,127,127,.12)}
.tmitem.on{background:rgba(47,158,224,.16);border-color:var(--accent)}
.tmitem canvas{width:44px;height:30px;flex:0 0 auto}
.tmitem .tmt{min-width:0;line-height:1.25}
.tmitem .tmt b{display:block;font-weight:500;font-size:12px}
.tmitem .tmt span{display:block;font-size:11px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tmitem .tmt span+span{color:var(--dim);font-size:10px}
.tmpane{margin-top:2px}
.tmname{color:var(--dim);font-size:11px;text-align:right;margin:-2px 0 4px}
.abt{text-align:center;padding:4px 0 14px;border-bottom:1px solid var(--line);
  margin-bottom:12px}
.abt svg{width:42px;height:42px;stroke:var(--accent);fill:none}
.abt h3{margin:6px 0 4px;font-size:16px;font-weight:600;letter-spacing:.04em}
.abt p{margin:2px 0;color:var(--dim);font-size:11px}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10px;
  border:1px solid var(--line);color:var(--dim)}
.pill.on{border-color:var(--ok);color:var(--ok)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.tmmain{flex:1;min-width:0;overflow:auto;padding:12px 14px}
.tmhead{display:flex;align-items:baseline;margin-bottom:10px}
.tmhead h2{margin:0;font-size:26px;font-weight:400}
.tmhead span{margin-left:auto;color:var(--dim);font-size:12px;text-align:right}
.tmstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px 20px;margin-top:12px}
.tmstats div b{display:block;color:var(--dim);font-weight:400;font-size:11px}
.tmstats div span{font-size:19px;font-weight:300;font-variant-numeric:tabular-nums}
#status{height:24px;background:var(--bar);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 10px;font-size:11px;
  color:var(--dim);flex:0 0 auto}
#status b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div id='login'>
  <div class='brand'>
    <svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5'>
      <path d='M12 2 3 7v10l9 5 9-5V7z'/><path d='M12 7v10M8 9v6M16 9v6'/>
    </svg>
    <span>&#917;&#923;&#928;&#921;&#931;</span>
  </div>
  <div class='card'>
    <form id='lf'>
      <div class='row'><label for='u'>Login</label><input id='u' value='admin' autocomplete='username'></div>
      <div class='row'><label for='p'>Password</label><input id='p' type='password' autocomplete='current-password'></div>
      <button type='submit'>Login</button>
    </form>
    <div id='err'></div>
  </div>
  <div class='hint'>Read-only status for the ELPIS recursive resolver.
    Nothing here changes how it resolves.</div>
</div>

<div id='desk'>
  <div id='top'>
    <div class='brand'>
      <svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5'>
        <path d='M12 2 3 7v10l9 5 9-5V7z'/><path d='M12 7v10M8 9v6M16 9v6'/>
      </svg><span>&#917;&#923;&#928;&#921;&#931;</span>
    </div>
    <span id='sub' style='color:var(--dim)'></span>
    <span class='spacer'></span>
    <button class='tbtn' id='theme'>Light</button>
    <button class='tbtn' id='tile'>Tile</button>
    <button class='tbtn' id='reset' title='Forget the saved window layout'>Reset</button>
    <button class='tbtn' id='out'>Log out</button>
  </div>
  <div id='surface'><div id='icons'></div></div>
  <div id='status'>
    <span>CPU <b id='s-cpu'>-</b></span>
    <span>RAM <b id='s-ram'>-</b></span>
    <span>QPS <b id='s-qps'>-</b></span>
    <span>Hit <b id='s-hit'>-</b></span>
    <span>Cached <b id='s-rtt'>-</b></span>
    <span>Resolved <b id='s-rec'>-</b></span>
    <span class='spacer'></span>
    <span id='s-ver'></span>
    <span>Up <b id='s-up'>-</b></span>
  </div>
</div>

<script>
'use strict';
var D = null, timer = null, zTop = 10, wins = {};

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function bytes(v){
  var u = ['B','KiB','MiB','GiB','TiB'], i = 0;
  v = Number(v) || 0;
  while (v >= 1024 && i < u.length - 1){ v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(v < 10 ? 2 : 1)) + ' ' + u[i];
}
function num(v){ return (Number(v)||0).toLocaleString(); }
function dur(s){
  s = Number(s)||0;
  var d = Math.floor(s/86400), h = Math.floor(s%86400/3600),
      m = Math.floor(s%3600/60);
  return (d ? d+'d ' : '') + h + 'h ' + m + 'm';
}
function last(a){ return (a && a.length) ? a[a.length-1] : 0; }
/* Query-weighted mean over the kept history: one idle second must not make
   the figure read zero, and a busy second must count for more than a quiet
   one. */
function wmean(vals, weights){
  var s = 0, n = 0, i;
  if (!vals) return 0;
  for (i = 0; i < vals.length; i++){ s += vals[i]*weights[i]; n += weights[i]; }
  return n ? s/n : 0;
}
/* Cache hits are tens of microseconds and recursions are hundreds of
   milliseconds, so the unit follows the number rather than forcing four
   leading zeros on one of them. */
function ms(us){
  us = Number(us) || 0;
  if (us < 1000)   return us.toFixed(0) + ' \u00b5s';
  if (us < 100000) return (us/1000).toFixed(1) + ' ms';
  return (us/1000).toFixed(0) + ' ms';
}
/* cpu_milli counts 1000 per fully busy core, so four busy cores read 4000.
   Divide by the cores actually present to get the figure every other tool
   shows: a share of the whole machine, 0 to 100. */
function cpuPct(d, v){
  var cores = (d.server && d.server.cores) || 1;
  return (v || 0) / (10 * cores);
}

/* ---------- graphs (Task Manager style) ---------- */
function graph(el, series, opts){
  opts = opts || {};
  var dpr = window.devicePixelRatio || 1;
  var w = el.clientWidth, h = opts.h || 96;
  el.width = Math.max(1, Math.floor(w*dpr));
  el.height = Math.floor(h*dpr);
  el.style.height = h + 'px';
  var g = el.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);

  var css = getComputedStyle(document.documentElement);
  var grid = css.getPropertyValue('--grid').trim();
  var i, j, x, y;

  g.strokeStyle = grid; g.lineWidth = 1;
  for (i = 1; i < 6 && !opts.bare; i++){
    y = Math.round(h*i/6) + 0.5;
    g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
  }
  for (i = 1; i < 10 && !opts.bare; i++){
    x = Math.round(w*i/10) + 0.5;
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke();
  }

  var max = opts.max || 0;
  for (j = 0; j < series.length; j++)
    for (i = 0; i < series[j].data.length; i++)
      if (series[j].data[i] > max) max = series[j].data[i];
  if (max <= 0) max = 1;

  var n = opts.points || 120;
  for (j = 0; j < series.length; j++){
    var d = series[j].data, col = series[j].color;
    var start = Math.max(0, d.length - n);
    var cnt = d.length - start;
    if (cnt < 1) continue;
    var step = w / (n - 1);
    g.beginPath();
    for (i = 0; i < cnt; i++){
      x = w - (cnt - 1 - i)*step;
      y = h - (d[start+i]/max)*(h-2) - 1;
      if (i === 0) g.moveTo(x,y); else g.lineTo(x,y);
    }
    if (series[j].fill !== false){
      g.lineTo(w, h); g.lineTo(w - (cnt-1)*step, h); g.closePath();
      g.fillStyle = col + '33'; g.fill();
      g.beginPath();
      for (i = 0; i < cnt; i++){
        x = w - (cnt - 1 - i)*step;
        y = h - (d[start+i]/max)*(h-2) - 1;
        if (i === 0) g.moveTo(x,y); else g.lineTo(x,y);
      }
    }
    g.strokeStyle = col; g.lineWidth = 1.4; g.stroke();
  }
  return max;
}

function gpanel(label, right){
  return "<div class='gwrap'><div class='ghead'><span>" + label +
         "</span><span class='spacer' style='flex:1'></span><span>" +
         right + "</span></div><canvas></canvas></div>";
}

/* ---------- window manager ---------- */
function focusWin(w){
  var k;
  for (k in wins) if (wins[k]) wins[k].el.classList.remove('active');
  w.el.classList.add('active');
  w.el.style.zIndex = ++zTop;
  layoutSave();
}

function drag(w, handle){
  handle.addEventListener('mousedown', function(e){
    if (e.target.tagName === 'BUTTON') return;
    focusWin(w);
    var sx = e.clientX, sy = e.clientY;
    var ox = w.el.offsetLeft, oy = w.el.offsetTop;
    var surf = $('surface');
    function mv(ev){
      var nx = ox + ev.clientX - sx, ny = oy + ev.clientY - sy;
      nx = Math.max(0, Math.min(nx, surf.clientWidth - 60));
      ny = Math.max(0, Math.min(ny, surf.clientHeight - 26));
      w.el.style.left = nx + 'px'; w.el.style.top = ny + 'px';
    }
    function up(){ document.removeEventListener('mousemove', mv);
                   document.removeEventListener('mouseup', up);
                   layoutSave(); }
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
    e.preventDefault();
  });
}

function resize(w, grip){
  grip.addEventListener('mousedown', function(e){
    focusWin(w);
    var sx = e.clientX, sy = e.clientY;
    var ow = w.el.offsetWidth, oh = w.el.offsetHeight;
    var surf = $('surface');
    w.userSized = 1;
    function mv(ev){
      var nw = Math.max(270, ow + ev.clientX - sx);
      var nh = Math.max(130, oh + ev.clientY - sy);
      nw = Math.min(nw, surf.clientWidth  - w.el.offsetLeft);
      nh = Math.min(nh, surf.clientHeight - w.el.offsetTop);
      w.el.style.width = nw + 'px'; w.el.style.height = nh + 'px';
      w.want = { w: nw, h: nh };
      if (D) w.def.render(w.body, D, w);
    }
    function up(){ document.removeEventListener('mousemove', mv);
                   document.removeEventListener('mouseup', up);
                   layoutSave(); }
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
    e.preventDefault(); e.stopPropagation();
  });
}

/* ---------- remembered layout ----------
 *
 * Where the windows are, how big they are and which is in front, kept in
 * localStorage rather than a cookie: the page polls /api/status once a second
 * and a cookie would ride along on every one of those requests, telling the
 * resolver something it has no use for. This is the browser's business.
 *
 * Storage can be absent or throw outright -- private windows, blocked site
 * data -- so every read and write is guarded and the page opens on its
 * defaults when anything is wrong. The layout is per origin, so reaching the
 * same resolver through an SSH tunnel and directly are two different desktops.
 */
var LAYOUT_KEY = 'elpis-layout';
var LAYOUT_VER = 1;
var saveTimer  = null;

function layoutSave(){
  if (saveTimer) return;                 /* coalesce a flurry of focus changes */
  saveTimer = setTimeout(function(){
    var list = [], k;
    saveTimer = null;
    for (k in wins) if (wins[k]) list.push(wins[k]);
    /* Stored bottom to front, so reopening rebuilds the same stack. */
    list.sort(function(a, b){
      return (+a.el.style.zIndex || 0) - (+b.el.style.zIndex || 0);
    });
    try {
      localStorage.setItem(LAYOUT_KEY, JSON.stringify({
        v: LAYOUT_VER,
        wins: list.map(function(w){
          return { id: w.def.id,
                   x: w.el.offsetLeft, y: w.el.offsetTop,
                   w: w.want.w, h: w.want.h,
                   sized: w.userSized ? 1 : 0,
                   sel: w.def.sel || '' };
        })
      }));
    } catch(_){}
  }, 400);
}

function layoutRestore(){
  var raw = null, saved, surf = $('surface'), i, opened = 0;
  try { raw = localStorage.getItem(LAYOUT_KEY); } catch(_){ return false; }
  if (!raw) return false;
  try { saved = JSON.parse(raw); } catch(_){ return false; }
  if (!saved || saved.v !== LAYOUT_VER || !saved.wins || !saved.wins.length)
    return false;

  for (i = 0; i < saved.wins.length; i++){
    var s = saved.wins[i], def = viewOf(s.id), w;
    if (!def) continue;                  /* a window this build no longer has */
    if (s.sel) def.sel = s.sel;
    openWin(def);
    w = wins[s.id];
    if (!w) continue;
    clampTo(w, surf, s.w, s.h, s.x, s.y);
    w.userSized = s.sized ? 1 : 0;
    paintWin(w);
    opened++;
  }
  return opened > 0;
}

function layoutForget(){
  try { localStorage.removeItem(LAYOUT_KEY); } catch(_){}
}

/* Put a window at this geometry, but never outside the desktop it is being
 * put on -- the screen it was saved from may have been a larger one, and a
 * title bar out of reach cannot be dragged back. */
function clampTo(w, surf, ww, hh, x, y){
  w.want = { w: ww, h: hh };            /* what it would like, if there is room */
  ww = Math.max(260, Math.min(ww, surf.clientWidth));
  hh = Math.max(140, Math.min(hh, surf.clientHeight));
  w.el.style.width  = ww + 'px';
  w.el.style.height = hh + 'px';
  /* Prefer the window wholly on the desktop; where it cannot fit, at least
   * leave enough title bar to grab. */
  w.el.style.left = Math.max(0, Math.min(x, Math.max(0, surf.clientWidth  - ww))) + 'px';
  w.el.style.top  = Math.max(0, Math.min(y, Math.max(0, surf.clientHeight - hh))) + 'px';
}

/*
 * Item 4: a window that cannot show its content grows to fit, but only as far
 * as the desktop allows and only until the user sizes it by hand -- after that
 * the size is theirs and we leave it alone.
 */
function fit(w){
  if (w.userSized || w.def.nofit) return;
  var b = w.body, surf = $('surface');
  var over = b.scrollHeight - b.clientHeight;
  if (over > 2){
    var room = surf.clientHeight - w.el.offsetTop - 8;
    var want = Math.min(w.el.offsetHeight + over + 2, room);
    if (want > w.el.offsetHeight){
      w.el.style.height = want + 'px';
      w.want.h = want;
    }
  }
  over = b.scrollWidth - b.clientWidth;
  if (over > 2){
    var roomw = surf.clientWidth - w.el.offsetLeft - 8;
    var wantw = Math.min(w.el.offsetWidth + over + 2, roomw);
    if (wantw > w.el.offsetWidth){
      w.el.style.width = wantw + 'px';
      w.want.w = wantw;
    }
  }
}

function paintWin(w){
  var h, ww;
  if (!D) return;
  h = w.el.offsetHeight; ww = w.el.offsetWidth;
  w.def.render(w.body, D, w);
  fit(w);
  if (w.el.offsetHeight !== h || w.el.offsetWidth !== ww) layoutSave();
}

var placed = 0;
function openWin(def){
  if (wins[def.id]){ focusWin(wins[def.id]); return; }
  var el = document.createElement('div');
  el.className = 'win';
  /* cascade, but never open a window that starts off the desktop */
  var surf = $('surface');
  var off  = (placed++ % 7) * 26;
  var x = Math.min(26 + off, Math.max(0, surf.clientWidth  - 180));
  var y = Math.min(16 + off, Math.max(0, surf.clientHeight - 120));
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  el.style.width  = Math.max(260, Math.min(def.w || 460, surf.clientWidth  - x - 8)) + 'px';
  el.style.height = Math.max(140, Math.min(def.h || 320, surf.clientHeight - y - 8)) + 'px';
  el.innerHTML = "<div class='wt'>" + def.icon + "<span>" + def.title +
                 "</span><button class='x' title='Close'>&#10005;</button></div>" +
                 "<div class='wb'></div><div class='rz'></div>";
  $('surface').appendChild(el);

  var w = { el: el, body: el.querySelector('.wb'), def: def,
            want: { w: def.w || 460, h: def.h || 320 } };
  wins[def.id] = w;
  el.querySelector('.x').onclick = function(){
    el.remove(); wins[def.id] = null; layoutSave();
  };
  el.addEventListener('mousedown', function(){ focusWin(w); });
  drag(w, el.querySelector('.wt'));
  resize(w, el.querySelector('.rz'));
  focusWin(w);
  paintWin(w);
}

function tile(){
  var ks = Object.keys(wins).filter(function(k){ return wins[k]; });
  if (!ks.length) return;
  var surf = $('surface');
  var cols = Math.ceil(Math.sqrt(ks.length));
  var rows = Math.ceil(ks.length / cols);
  var cw = Math.floor(surf.clientWidth / cols);
  var ch = Math.floor(surf.clientHeight / rows);
  ks.forEach(function(k, i){
    var w = wins[k];
    w.el.style.left = ((i % cols) * cw) + 'px';
    w.el.style.top  = (Math.floor(i / cols) * ch) + 'px';
    w.el.style.width  = (cw - 6) + 'px';
    w.el.style.height = (ch - 6) + 'px';
    w.want = { w: cw - 6, h: ch - 6 };
    w.userSized = 1;
    if (D) w.def.render(w.body, D, w);
  });
  layoutSave();
}

/* ---------- renderers ---------- */
function rows(list, label){
  if (!list || !list.length)
    return "<table><tr><td style='color:var(--dim)'>nothing yet</td></tr></table>";
  var h = "<table><tr><th>" + label + "</th><th class='n'>count</th></tr>";
  list.forEach(function(r){
    h += "<tr><td title='" + esc(r.k) + "'>" + esc(r.k) + "</td><td class='n'>" +
         num(r.n) + "</td></tr>";
  });
  return h + "</table>";
}

/*
 * Item 8: how the rest of the internet sees this resolver.  The addresses are
 * whichever ones the kernel picks to leave the box by, and the AS is what
 * Team Cymru's origin lookup says about them -- resolved through our own
 * recursion, so an empty field simply means we have not got an answer yet.
 */
/*
 * An edition is only worth as much as what backs it: self-declared until a
 * signed licence says otherwise, so the page never shows one without saying
 * which it is.
 */
function licPill(d){
  var l = (d.server.licence || {}).state || 'none';
  if (l === 'verified') return "<span class='pill on'>signed</span>";
  if (l === 'expired')  return "<span class='pill warn'>signed, expired</span>";
  if (l === 'rejected') return "<span class='pill bad'>licence rejected</span>";
  return "<span class='pill'>self-declared</span>";
}

function licRows(d){
  var l = d.server.licence || {};
  if (l.state === 'verified' || l.state === 'expired')
    return "<b>licensed to</b><span>" + esc(l.org) + "</span>" +
           "<b>licence serial</b><span>" + (l.serial|0) + "</span>" +
           "<b>licence expires</b><span>" + esc(l.expires) +
             (l.state === 'expired' ? " (expired)" : "") + "</span>";
  if (l.state === 'rejected')
    return "<b>licence</b><span style='color:var(--bad)'>" + esc(l.why) + "</span>";
  return "";
}

function host(d){
  var h = d.self || {};
  function or(v){ return v ? esc(v) : "<span style='color:var(--dim)'>looking up...</span>"; }
  return "<div><h4>This host, from outside</h4><div class='kv'>" +
    "<b>public IPv4</b><span>" + or(h.v4) + "</span>" +
    "<b>public IPv6</b><span style='word-break:break-all'>" + or(h.v6) + "</span>" +
    "<b>AS number</b><span>" + or(h.asn) + "</span>" +
    "<b>AS name</b><span>" + or(h.asname) + "</span></div></div>";
}

/*
 * Item 7: who among the roots is actually answering fastest.  The order is the
 * resolver's own live opinion from the infrastructure cache -- the same
 * numbers it uses to decide who to ask next -- not a startup probe.
 */
{ id:'roots', title:'Root servers', w:600, h:420,
  icon:"<svg viewBox='0 0 24 24'><path d='M12 3v7M12 14v7'/><circle cx='12' cy='12' r='2'/>" +
       "<path d='M5 21h14M5 3h14'/></svg>",
  render: function(b, d){
    /*
     * A root that has never been asked still carries the optimistic starting
     * estimate, which is not a measurement -- rank those last and say so,
     * rather than showing a time the resolver has not actually observed.
     */
    var all = d.roots || [], r = [], cold = [], best = 0, i;
    for (i = 0; i < all.length; i++)
      (all[i].queries ? r : cold).push(all[i]);
    for (i = 0; i < r.length; i++) if (r[i].rtt > best) best = r[i].rtt;
    if (!best) best = 1;
    r = r.concat(cold);
    var h = "<table><tr><th>#</th><th>server</th><th>address</th>" +
            "<th class='n'>round trip</th><th class='n'>asked</th>" +
            "<th class='n'>timeouts</th></tr>";
    if (!r.length)
      h += "<tr><td colspan='6' style='color:var(--dim)'>no root hints loaded</td></tr>";
    r.forEach(function(x, j){
      var bar = '', lbl;
      if (x.queries){
        var wd  = Math.max(2, Math.round(x.rtt * 100 / best));
        var col = x.timeouts ? 'var(--warn)' : 'var(--accent)';
        bar = "<span style='display:inline-block;height:7px;width:" + wd +
              "px;background:" + col + ";vertical-align:middle;margin-right:6px'></span>";
        lbl = x.rtt + ' ms';
      } else {
        lbl = "<span style='color:var(--dim)'>not asked yet</span>";
      }
      h += "<tr><td class='n'>" + (x.queries ? j+1 : '') + "</td><td>" + esc(x.name) +
           "</td><td>" + esc(x.addr) + "</td><td class='n'>" + bar + lbl +
           "</td><td class='n'>" + num(x.queries) + "</td><td class='n'>" +
           num(x.timeouts) + "</td></tr>";
    });
    b.innerHTML = h + "</table><div style='color:var(--dim);margin-top:8px'>" +
      "Ranked by smoothed round trip, as measured by this resolver. The " +
      "resolver prefers whoever has been quickest lately, so this order is " +
      "roughly what it will use next.</div>";
  }},

      "<b>identity probe</b><span>" + (d.server.identity ?
        "<code>" + esc(d.server.identity) + "</code>" :
        "<span style='color:var(--dim)'>off</span>") + "</span>" +
      "</div><div style='height:10px'></div>" +
      "<div class='kv'>" +
      "<b>version</b><span>" + esc(d.server.version) + "</span>" +
      "<b>compiler</b><span>" + esc(d.server.cc || 'unknown') + "</span>" +
      "<b>build</b><span>" + (d.server.build ?
          "<code>" + esc(d.server.build) + "</code>" :
          "<span style='color:var(--dim)'>not a git checkout</span>") + "</span>" +
      "<b>uptime</b><span>" + dur(d.server.uptime) + "</span>" +
      "<b>workers</b><span>" + d.server.workers + "</span>" +
      "<b>SIMD</b><span>" + esc(d.server.simd) + "</span>" +
      "<b>event loop</b><span>" + esc(d.server.loop) + "</span>" +
      "<b>DNSSEC</b><span>" + (d.server.dnssec ? 'validating' : 'off') + "</span>" +
      "</div>";

    h += "<h4 style='margin-top:12px'>Post-quantum signatures</h4><table>";
    m.forEach(function(x){
      h += "<tr><td>" + esc(x.name) + "</td><td><span class='pill " +
           (x.state === 'active' ? 'on' : '') + "'>" + esc(x.state) +
           "</span></td><td class='n'>algorithm " + x.alg + "</td>" +
           "<td style='color:var(--dim)'>" + esc(x.note) + "</td></tr>";
    });
    h += "</table>";

    b.innerHTML = h + "<div style='color:var(--dim);margin-top:10px'>" +
      "All three verifiers are built in. <b>active</b> means the algorithm " +
      "number is one somebody else uses too; <b>available</b> means it is a " +
      "local placeholder, set with <code>mldsa65-algorithm:</code> and friends." +
      "</div><div style='color:var(--dim);margin-top:8px'>" +
      "This page is read-only. It has no endpoint that changes anything.</div>";
  }}
];

/* ---------- data ---------- */
function paint(){
  var k;
  for (k in wins) if (wins[k]) paintWin(wins[k]);
  $('s-cpu').textContent = cpuPct(D, last(D.history.cpu)).toFixed(0) + '%';
  $('s-ram').textContent = bytes(last(D.history.rss));
  $('s-qps').textContent = num(last(D.history.qps));
  $('s-hit').textContent = D.stats.hitpct + '%';
  $('s-rtt').textContent = ms(wmean(D.history.rtt, D.history.rttn));
  $('s-rec').textContent = ms(wmean(D.history.rec, D.history.recn));
  $('s-up').textContent  = dur(D.server.uptime);
  $('s-ver').textContent = 'elpis ' + D.server.version;
  $('sub').textContent   = D.server.listen.length ? D.server.listen[0] : '';
}

function poll(){
  fetch('/api/status', { credentials:'same-origin' })
    .then(function(r){
      if (r.status === 401){ showLogin(); throw new Error('auth'); }
      return r.json();
    })
    .then(function(j){ D = j; paint(); })
    .catch(function(){});
}

function showDesk(){
  $('login').style.display = 'none';
  $('desk').style.display = 'flex';
  if (!Object.keys(wins).length && !layoutRestore()){
    openWin(viewOf('overview')); openWin(viewOf('taskman'));
  }
  poll();
  if (timer) clearInterval(timer);
  timer = setInterval(poll, 1000);
}

function showLogin(){
  if (timer){ clearInterval(timer); timer = null; }
  $('desk').style.display = 'none';
  $('login').style.display = 'flex';
  $('p').value = '';
  setTimeout(function(){ $('p').focus(); }, 30);
}

/* ---------- wiring ---------- */
$('icons').innerHTML = VIEWS.map(function(v, i){
  return "<div class='icon' data-i='" + i + "'>" + v.icon +
         "<div>" + v.title + "</div></div>";
}).join('');
$('icons').addEventListener('dblclick', function(e){
  var t = e.target.closest('.icon');
  if (t) openWin(VIEWS[+t.dataset.i]);
});
$('icons').addEventListener('click', function(e){
  var t = e.target.closest('.icon');
  if (t && e.detail === 1) openWin(VIEWS[+t.dataset.i]);
});

$('lf').addEventListener('submit', function(e){
  e.preventDefault();
  $('err').textContent = '';
  var body = 'user=' + encodeURIComponent($('u').value) +
             '&pass=' + encodeURIComponent($('p').value);
  fetch('/api/login', { method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body })
    .then(function(r){
      if (r.ok) showDesk();
      else $('err').textContent = 'Wrong user name or password.';
    })
    .catch(function(){ $('err').textContent = 'Cannot reach the resolver.'; });
});

$('out').onclick = function(){
  fetch('/api/logout', { method:'POST', credentials:'same-origin' })
    .then(showLogin).catch(showLogin);
};
$('tile').onclick = tile;
$('reset').onclick = function(){
  var k;
  layoutForget();
  for (k in wins) if (wins[k]){ wins[k].el.remove(); wins[k] = null; }
  /* back to defaults means the panes too, not just the geometry */
  VIEWS.forEach(function(v){ delete v.sel; });
  placed = 0; zTop = 10;
  openWin(viewOf('overview')); openWin(viewOf('taskman'));
};
$('theme').onclick = function(){
  var r = document.documentElement;
  var light = r.getAttribute('data-theme') === 'light';
  r.setAttribute('data-theme', light ? 'dark' : 'light');
  this.textContent = light ? 'Light' : 'Dark';
  try { localStorage.setItem('elpis-theme', light ? 'dark' : 'light'); } catch(_){}
  if (D) paint();
};
try {
  var saved = localStorage.getItem('elpis-theme');
  if (saved){
    document.documentElement.setAttribute('data-theme', saved);
    $('theme').textContent = saved === 'light' ? 'Dark' : 'Light';
  }
} catch(_){}

window.addEventListener('resize', function(){
  var surf = $('surface'), k, w;
  for (k in wins){
    w = wins[k];
    if (!w) continue;
    clampTo(w, surf, w.want.w, w.want.h, w.el.offsetLeft, w.el.offsetTop);
  }
  if (D) paint();
  layoutSave();
});

fetch('/api/session', { credentials:'same-origin' })
  .then(function(r){ return r.json(); })
  .then(function(j){ if (j.ok) showDesk(); else showLogin(); })
  .catch(showLogin);
</script>
</body>
</html>
