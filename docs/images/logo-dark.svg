  <text x="195" y="95" fill="#8d949d" font-family="'Segoe UI','Helvetica Neue',Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="17" font-weight="600" textLength="152" lengthAdjust="spacing">RESOLVER</text>
</svg>
