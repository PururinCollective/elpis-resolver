<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120" role="img" aria-label="ΕΛΠΙΣ Resolver">
  <title>ΕΛΠΙΣ Resolver</title>
  <!-- The status page's mark, drawn at 4.5x: a hexagon, three strokes. -->
  <g transform="translate(70 6) scale(4.5)" fill="none" stroke="#2f9ee0" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M12 2 3 7v10l9 5 9-5V7z"/>
    <path d="M12 7v10M8 9v6M16 9v6"/>
  </g>
